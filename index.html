<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Naija Campus v0.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131d;color:#edf0ff;font:14px system-ui,Segoe UI,sans-serif;display:flex;justify-content:center;min-height:100vh}.app{width:min(1100px,100%);padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.brand{font-weight:900;font-size:22px;letter-spacing:.4px}.brand span{color:#8b75ff}.status{font-size:12px;color:#b8c1d9}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}.game{position:relative;background:#1a2030;border-radius:16px;overflow:hidden;border:1px solid #333c52}.canvaswrap{width:100%;aspect-ratio:16/10}canvas{display:block;width:100%;height:100%}.side{display:flex;flex-direction:column;gap:12px}.card{background:#1a2030;border:1px solid #30394e;border-radius:14px;padding:12px}.card h3{margin:0 0 8px;font-size:14px}.online{max-height:185px;overflow:auto}.playerrow{padding:7px 0;border-bottom:1px solid #2d3446;font-size:12px;display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#54d69a;display:inline-block}.chatlog{height:190px;overflow:auto;font-size:12px;color:#dbe1f4;line-height:1.45}.chatline{margin:5px 0;overflow-wrap:anywhere}.chatline b{color:#b7a9ff}.chatform{display:flex;gap:6px;margin-top:8px}.chatform input{min-width:0;flex:1}.input,select,button{border-radius:9px;border:1px solid #39435b;background:#111725;color:#fff;padding:9px;font:inherit}.btn{cursor:pointer;background:#6554dc;border:0;font-weight:700}.profile{display:grid;gap:7px}.profile button{width:100%}.help{font-size:12px;color:#aab5d0;line-height:1.5}.touch{display:none;position:absolute;bottom:12px;left:12px;grid-template-columns:repeat(3,42px;gap:4px)}.touch button{opacity:.85;padding:8px}.pad{display:grid;grid-template-columns:repeat(3,40px;gap:4px}.pad button{padding:8px}.touch .empty{visibility:hidden}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.card.chatcard{grid-column:1/-1}.canvaswrap{aspect-ratio:4/3}.online{max-height:140px}}
</style></head><body><div class="app"><div class="top"><div class="brand">NAIJA <span>CAMPUS</span> <small style="font-size:12px;color:#8994ad">v0.3</small></div><div class="status" id="status">Connecting…</div></div>
<div class="layout"><div class="game"><div class="canvaswrap"><canvas id="world" width="840" height="525"></canvas></div><div class="touch" id="touch"><button class="empty">.</button><button data-dir="up">▲</button><button class="empty">.</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div>
<div class="side"><div class="card profile"><h3>Your student profile</h3><input id="nickname" class="input" placeholder="Nickname" maxlength="20"><select id="school"><option>FUOYE</option><option>UNILAG</option><option>OAU</option><option>UNIBEN</option><option>UI</option><option>FUTA</option><option>UNN</option><option>LASU</option><option>Other</option></select><button class="btn" id="save">Enter campus</button><div class="help">Move with WASD or arrow keys. This is a live shared room.</div></div>
<div class="card"><h3>Online students <span id="count">0</span></h3><div class="online" id="online"></div></div><div class="card chatcard"><h3>Campus chat</h3><div class="chatlog" id="chat"></div><form class="chatform" id="form"><input class="input" id="message" maxlength="180" placeholder="Say something…"><button class="btn">Send</button></form></div></div></div></div>
<script>
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');const statusEl=document.getElementById('status'),onlineEl=document.getElementById('online'),countEl=document.getElementById('count'),chatEl=document.getElementById('chat');let ws,myId='',players={},profileSet=false;let pos={x:420,y:300};let keys={};const schools=['FUOYE','UNILAG','OAU','UNIBEN','UI','FUTA','UNN','LASU','Other'];
function connect(){const proto=location.protocol==='https:'?'wss':'ws';const host=location.hostname||'localhost';ws=new WebSocket(`${proto}://${host}:8080`);ws.onopen=()=>statusEl.textContent='🟢 Connected to live campus';ws.onclose=()=>{statusEl.textContent='🔴 Offline — retrying…';setTimeout(connect,1800)};ws.onerror=()=>statusEl.textContent='Connection issue';ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='welcome'){myId=m.id;players={};m.players.forEach(p=>players[p.id]=p);renderPlayers()}if(m.type==='join'){players[m.player.id]=m.player;renderPlayers()}if(m.type==='leave'){delete players[m.id];renderPlayers()}if(m.type==='update'){players[m.player.id]=m.player;renderPlayers()}if(m.type==='move'){if(players[m.id]){players[m.id].x=m.x;players[m.id].y=m.y}}if(m.type==='state'){m.players.forEach(p=>players[p.id]=p);players=Object.fromEntries(Object.entries(players).filter(([id])=>m.players.some(p=>p.id===id)));renderPlayers()}if(m.type==='chat')addChat(`<b>${escapeHtml(m.name)}</b> <small>(${escapeHtml(m.school)})</small>: ${escapeHtml(m.text)}`)}};
function send(obj){if(ws&&ws.readyState===1)ws.send(JSON.stringify(obj))}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addChat(html){const d=document.createElement('div');d.className='chatline';d.innerHTML=html;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight}
function renderPlayers(){onlineEl.innerHTML='';Object.values(players).forEach(p=>{const r=document.createElement('div');r.className='playerrow';r.innerHTML=`<span class="dot"></span><b>${escapeHtml(p.name)}</b><span style="opacity:.65">${escapeHtml(p.school)}</span>${p.id===myId?' <em>(you)</em>':''}`;onlineEl.appendChild(r)});countEl.textContent=Object.keys(players).length}
document.getElementById('save').onclick=()=>{const name=document.getElementById('nickname').value.trim()||'Student';const school=document.getElementById('school').value;profileSet=true;send({type:'profile',name,school});addChat(`<i>You joined as ${escapeHtml(name)} (${escapeHtml(school)})</i>`)};
document.getElementById('form').onsubmit=e=>{e.preventDefault();const inp=document.getElementById('message');if(inp.value.trim()){send({type:'chat',text:inp.value.trim()});inp.value=''}};
function draw(){ctx.clearRect(0,0,840,525);ctx.fillStyle='#253c35';ctx.fillRect(0,0,840,525); // grass
// paths
ctx.fillStyle='#c9b58c';ctx.fillRect(0,235,840,80);ctx.fillRect(380,0,80,525);
// lawn patterns
for(let i=0;i<80;i++){ctx.fillStyle=i%2?'#2a493e':'#29463b';ctx.fillRect((i*71)%840,(i*37)%525,12,7)}
function building(x,y,w,h,label,color){ctx.fillStyle='#172321';ctx.fillRect(x+6,y+8,w,h);ctx.fillStyle=color;ctx.fillRect(x,y,w,h);ctx.fillStyle='#e8e8d6';ctx.fillRect(x+8,y+8,w-16,10);ctx.fillStyle='#e9e9df';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText(label,x+w/2,y+h/2+5);ctx.fillStyle='#344a51';for(let xx=x+16;xx<x+w-8;xx+=32)ctx.fillRect(xx,y+28,18,25)}
building(45,40,185,110,'CAFETERIA','#7b5848');building(600,35,180,115,'LIBRARY','#536e91');building(48,365,190,110,'STUDENT UNION','#745c8f');building(600,365,180,110,'HOSTEL','#8a6551');
// fountain center
ctx.beginPath();ctx.arc(420,275,42,0,Math.PI*2);ctx.fillStyle='#7aa4c5';ctx.fill();ctx.beginPath();ctx.arc(420,275,30,0,Math.PI*2);ctx.fillStyle='#6cc8dc';ctx.fill();ctx.fillStyle='#f1e6c4';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('CAMPUS SQUARE',420,335);
// players
Object.values(players).forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.fillStyle=p.color||'#8b75ff';ctx.fill();ctx.strokeStyle=p.id===myId?'#fff':'#182026';ctx.lineWidth=p.id===myId?3:1;ctx.stroke();ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText((p.name||'Student').slice(0,14),p.x,p.y-20);ctx.font='10px system-ui';ctx.fillStyle='#d5d9e7';ctx.fillText(p.school||'',p.x,p.y+25)});
requestAnimationFrame(draw)}draw();
function move(dx,dy){if(!myId)return;pos.x=Math.max(20,Math.min(820,pos.x+dx));pos.y=Math.max(35,Math.min(510,pos.y+dy));send({type:'move',x:pos.x,y:pos.y});if(players[myId]){players[myId].x=pos.x;players[myId].y=pos.y}}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
setInterval(()=>{let dx=0,dy=0;if(keys.w||keys.arrowup)dy-=4;if(keys.s||keys.arrowdown)dy+=4;if(keys.a||keys.arrowleft)dx-=4;if(keys.d||keys.arrowright)dx+=4;if(dx||dy)move(dx,dy)},35);
// mobile tap-pad buttons
let touchInterval;document.querySelectorAll('[data-dir]').forEach(b=>{const dir=b.dataset.dir;const start=()=>{const map={up:[0,-4],down:[0,4],left:[-4,0],right:[4,0]};let [dx,dy]=map[dir];move(dx,dy);touchInterval=setInterval(()=>move(dx,dy),90)};const stop=()=>clearInterval(touchInterval);b.addEventListener('pointerdown',start);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,stop))});
connect();
</script></body></html>
